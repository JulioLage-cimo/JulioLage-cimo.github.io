<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motrix — Pitch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0d1814;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #ccbfa7;
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 64px;
    padding: 48px 24px;
    max-width: 720px;
    width: 100%;
  }

  /* Logo */
  .logo img {
    width: 200px;
    height: auto;
    opacity: 0.88;
  }

  .subtitle {
    font-family: 'Hanken Grotesk', sans-serif;
    font-size: 13px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(204, 191, 167, 0.45);
    font-weight: 500;
    margin-top: -40px;
  }

  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
    width: 100%;
  }

  .card {
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 36px 32px;
    border: 1px solid rgba(204, 191, 167, 0.12);
    background: rgba(204, 191, 167, 0.03);
    text-decoration: none;
    color: inherit;
    transition: border-color 0.3s, background 0.3s, transform 0.2s;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 80% 80% at 50% 120%, rgba(204, 191, 167, 0.06), transparent 70%);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .card:hover {
    border-color: rgba(204, 191, 167, 0.3);
    background: rgba(204, 191, 167, 0.05);
    transform: translateY(-2px);
  }

  .card:hover::before {
    opacity: 1;
  }

  .card-icon {
    font-size: 28px;
    opacity: 0.7;
  }

  .card-label {
    font-family: 'Hanken Grotesk', sans-serif;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(204, 191, 167, 0.4);
    font-weight: 600;
  }

  .card-title {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 26px;
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1.25;
    color: #ccbfa7;
  }

  .card-desc {
    font-size: 14px;
    line-height: 1.6;
    color: rgba(204, 191, 167, 0.5);
    font-weight: 300;
  }

  .card-arrow {
    margin-top: auto;
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 500;
    color: rgba(204, 191, 167, 0.35);
    transition: color 0.3s;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card:hover .card-arrow {
    color: rgba(204, 191, 167, 0.75);
  }

  @media (max-width: 600px) {
    .cards { grid-template-columns: 1fr; }
    .container { gap: 48px; }
    .card-title { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="logo">
    <img src="app-assets/motrix-mark.png" alt="Motrix">
  </div>

  <p class="subtitle">Escolha a apresentação</p>

  <div class="cards">

    <a class="card" href="Motrix%20Pitch%20(Roteiro%203%20min).html">
      <span class="card-label">Pitch · 3 min</span>
      <span class="card-title">Roteiro Executivo</span>
      <span class="card-desc">Versão concisa com os pontos-chave para apresentações rápidas e reuniões presenciais.</span>
      <span class="card-arrow">Abrir →</span>
    </a>

    <a class="card" href="Motrix%20Pitch%20Deck%20(offline).html">
      <span class="card-label">Deck Completo</span>
      <span class="card-title">Apresentação Integral</span>
      <span class="card-desc">Versão completa com todos os detalhes do produto, mercado, modelo e roadmap.</span>
      <span class="card-arrow">Abrir →</span>
    </a>

  </div>

</div>

</body>
</html>
