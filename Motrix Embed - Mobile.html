<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Motrix — Mobile (embed)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Hanken+Grotesk:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --mx-bg:         #0d1814;
    --mx-surface:    #15241d;
    --mx-surface-2:  #1c2f26;
    --mx-sand:       #ccbfa7;
    --mx-sand-dim:   rgba(204,191,167,0.6);
    --mx-ink:        #f3ecdc;
    --mx-ink-dim:    rgba(243,236,220,0.6);
    --mx-rule:       rgba(204,191,167,0.18);
    --mx-rule-soft:  rgba(204,191,167,0.09);
    --mx-pos:        #6fcf97;
    --mx-neg:        #d98b6e;
    --mx-r:          16px;
    --mx-r-sm:       11px;
    --mx-serif: 'EB Garamond', Georgia, serif;
    --mx-sans:  'Hanken Grotesk', -apple-system, 'Segoe UI', sans-serif;
    --mx-num:   'Inter', 'Hanken Grotesk', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #0d1814; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overflow: hidden; }
  ::-webkit-scrollbar { width: 0; height: 0; }
</style>

<meta name="ext-resource-dependency" content="app-assets/motrix-mark.png" data-resource-id="motrixMark" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="motrix-data.jsx"></script>
<script type="text/babel" src="motrix-ui.jsx"></script>
<script type="text/babel" src="motrix-mobile-screens.jsx"></script>
<script type="text/babel" src="motrix-mobile.jsx"></script>

<script type="text/babel">
  const { useState: emUseState, useLayoutEffect: emUseLayout } = React;
  const BASE_W = 393, BASE_H = 852, PAD = 26;

  function EmbedStage() {
    const [scale, setScale] = emUseState(1);
    emUseLayout(() => {
      const fit = () => {
        const s = Math.min(
          (window.innerWidth  - PAD * 2) / BASE_W,
          (window.innerHeight - PAD * 2) / BASE_H
        );
        setScale(s > 0 ? s : 1);
      };
      fit();
      window.addEventListener('resize', fit);
      return () => window.removeEventListener('resize', fit);
    }, []);
    return (
      <div style={{ width: '100vw', height: '100vh', display: 'grid', placeItems: 'center', overflow: 'hidden' }}>
        <div style={{ width: BASE_W, height: BASE_H, transform: `scale(${scale})`, transformOrigin: 'center center' }}>
          <IOSDevice dark width={BASE_W} height={BASE_H}>
            <MobileApp />
          </IOSDevice>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<EmbedStage />);
</script>

</body>
</html>
